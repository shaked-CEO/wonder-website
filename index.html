<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonder Autonomy</title>
<meta name="description" content="Wonder Autonomy">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#000}
body{color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;z-index:1;display:grid;place-items:center;min-height:100svh}
.brand{padding:28px}
h1{margin:0;color:#fff;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:clamp(2.6rem,7.5vw,7.5rem);font-weight:500;line-height:1;letter-spacing:-.065em;text-align:center}
@media (max-width:600px){h1{font-size:clamp(2.2rem,10vw,4rem)}}
@media (prefers-reduced-motion:reduce){</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="stage">
  <div class="brand">
    <h1>Wonder Autonomy</h1>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, stars = [], meteor = null, nextMeteor = 0;

  // Shooting-star direction: top-left to bottom-right, same angle for all
  const ANGLE = 35 * Math.PI / 180;
  const DX = Math.cos(ANGLE), DY = Math.sin(ANGLE);

  function makeStars() {
    const count = Math.round((W * H) / 2600);
    stars = [];
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      // mostly tiny, a few slightly larger
      const size = r < 0.75 ? 0.35 + Math.random() * 0.45
                 : r < 0.95 ? 0.8 + Math.random() * 0.5
                 : 1.3 + Math.random() * 0.6;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: size,
        base: 0.35 + Math.random() * 0.55,
        amp: 0.2 + Math.random() * 0.45,
        speed: 0.6 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    makeStars();
    if (reduce) drawStars(0);
  }

  function drawStars(t) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduce ? s.base
        : Math.max(0.05, Math.min(1, s.base + Math.sin(t * s.speed + s.phase) * s.amp));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
      ctx.fill();
      if (s.s > 1.2) { // soft glow on the larger ones
        ctx.globalAlpha = a * 0.15;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function spawnMeteor(now) {
    // start anywhere in the upper/left band so paths cross different parts of the screen
    const fromTop = Math.random() < 0.6;
    const x = fromTop ? Math.random() * W * 0.85 : -40;
    const y = fromTop ? -40 + Math.random() * H * 0.25 : Math.random() * H * 0.6;
    meteor = {
      x, y,
      len: 90 + Math.random() * 110,
      speed: 650 + Math.random() * 450, // px per second
      born: now,
      life: 0.9 + Math.random() * 0.7   // seconds
    };
  }

  function drawMeteor(now) {
    const m = meteor;
    const age = (now - m.born) / 1000;
    if (age > m.life) { meteor = null; nextMeteor = now + 2000 + Math.random() * 3000; return; }
    const hx = m.x + DX * m.speed * age;
    const hy = m.y + DY * m.speed * age;
    const tx = hx - DX * m.len, ty = hy - DY * m.len;
    // fade in quickly, fade out toward the end
    const p = age / m.life;
    const alpha = p < 0.15 ? p / 0.15 : 1 - Math.pow((p - 0.15) / 0.85, 2);
    const g = ctx.createLinearGradient(hx, hy, tx, ty);
    g.addColorStop(0, `rgba(255,255,255,${0.95 * alpha})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(hx, hy, 1.3, 0, Math.PI * 2); ctx.fill();
  }

  function frame(now) {
    drawStars(now / 1000);
    if (!meteor && now >= nextMeteor) spawnMeteor(now);
    if (meteor) drawMeteor(now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduce) { nextMeteor = performance.now() + 1200; requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
