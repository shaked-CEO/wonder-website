<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonder Autonomy</title>
<meta name="description" content="Wonder Autonomy">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23030403'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#030403;color:#fff;-webkit-font-smoothing:antialiased}
.starfield{position:relative;display:grid;min-height:100svh;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 43% 48%,rgb(255 105 15 / .045),transparent 32%),#030403}
.stars{position:fixed;inset:-30px;pointer-events:none}
.stars-small{
  background-image:radial-gradient(circle,rgb(255 255 255 / .75) 0 .7px,transparent 1px),
    radial-gradient(circle,rgb(255 255 255 / .4) 0 .55px,transparent .9px);
  background-position:0 0,37px 61px;background-size:83px 83px,127px 127px;
  -webkit-mask-image:radial-gradient(circle at center,black,rgb(0 0 0 / .7) 58%,transparent 100%);
  mask-image:radial-gradient(circle at center,black,rgb(0 0 0 / .7) 58%,transparent 100%);
  animation:drift 80s linear infinite}
.stars-large{
  background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle,#ff9a3c 0 .8px,transparent 1.3px);
  background-position:18px 28px,90px 140px;background-size:211px 211px,313px 313px;
  animation:twinkle 5s ease-in-out infinite alternate}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:clamp(16px,2.2vw,28px);padding:28px}
.sun{position:relative;display:block;width:clamp(32px,3.8vw,46px);height:clamp(32px,3.8vw,46px);flex:none;overflow:hidden;
  border:.75px solid rgb(255 255 255 / .9);border-radius:50%;background:transparent;
  box-shadow:0 0 5px rgb(255 255 255 / .34),0 0 12px rgb(255 255 255 / .12);
  animation:sun-breathe 6s ease-in-out infinite alternate}
h1{margin:0;color:#fff;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:clamp(2rem,5.3vw,5.2rem);font-weight:500;line-height:1;letter-spacing:-.065em;text-align:center}
@keyframes drift{to{transform:translate3d(30px,30px,0)}}
@keyframes twinkle{from{opacity:.3}to{opacity:.85}}
@keyframes sun-breathe{from{transform:scale(.985);filter:saturate(.95)}to{transform:scale(1.015);filter:saturate(1.08)}}
@media (max-width:600px){.brand{flex-direction:column;gap:18px}h1{font-size:clamp(1.9rem,9vw,3rem)}}
@media (prefers-reduced-motion:reduce){.stars,.sun{animation:none}}
</style>
</head>
<body>
<main class="starfield">
  <div class="stars stars-small" aria-hidden="true"></div>
  <div class="stars stars-large" aria-hidden="true"></div>
  <div class="brand">
    <span class="sun" aria-hidden="true"></span>
    <h1>Wonder Autonomy</h1>
  </div>
</main>
</body>
</html>
